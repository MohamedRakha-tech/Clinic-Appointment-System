{% extends 'base.html' %}
{% block title %}Error{% endblock %}
{% block topbar_subtitle %}Error{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger shadow-sm">
        <h4 class="alert-heading"><i class="bi bi-exclamation-triangle-fill me-2"></i> Error</h4>
        <p>{{ error|default:"An unexpected error occurred." }}</p>
        <hr>
        <p class="mb-0">
            <a href="javascript:history.back()" class="btn btn-outline-danger btn-sm">Go Back</a>
        </p>
    </div>
</div>
{% endblock %}
