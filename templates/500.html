<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        :root {
            --app-bg: #f4f7fb;
            --panel-bg: #ffffff;
            --ink: #141d23;
            --brand: #0b4ea2;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #e8f1ff 0%, var(--app-bg) 45%, #f8fbff 100%);
            color: var(--ink);
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        .error-card {
            background: var(--panel-bg);
            border: 1px solid #dde8f4;
            border-radius: 1rem;
            box-shadow: 0 8px 30px rgba(15, 55, 110, .06);
            padding: 2rem;
            max-width: 520px;
            width: 100%;
        }

        .error-code {
            font-size: 3rem;
            font-weight: 800;
            color: var(--brand);
        }
    </style>
</head>
<body>
    <main class="error-card text-center">
        <div class="error-code">500</div>
        <h1 class="h4 fw-bold">Something Went Wrong</h1>
        <p class="text-muted">An unexpected error occurred. Please try again.</p>
        <a href="/" class="btn btn-primary">Go Home</a>
    </main>
</body>
</html>
